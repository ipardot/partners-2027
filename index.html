<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Partners 2027 · Un mundo de propuestas</title>
  <meta name="description" content="Alejandro Galeano Mejía · Propuestas para la Presidencia de Partners Campus EAFIT 2027.">
  <link rel="icon" href="assets/isotipo.webp" type="image/webp">
  <link rel="preload" href="assets/fonts/poppins-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/poppins-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="stage">
    <div id="camera"></div>
    <div class="vignette" aria-hidden="true"></div>
    <main id="panel" class="panel" aria-live="polite"></main>

    <header id="topbar" class="chrome">
      <img class="logo" src="assets/logo-partners.webp" alt="Partners Campus">
      <div id="crumb" class="crumb"></div>
      <div class="tools">
        <button id="btn-index" class="tool" title="Índice de secciones (I)"></button>
        <button id="btn-pano" class="tool" title="Vista panorámica (P)"></button>
        <button id="btn-motion" class="tool" title="Reducir animaciones (A)" aria-pressed="false"></button>
        <button id="btn-full" class="tool" title="Pantalla completa (F)"></button>
      </div>
    </header>

    <nav id="bottombar" class="chrome" aria-label="Navegación de la presentación">
      <button id="btn-prev" class="nav-btn" title="Anterior (←)" aria-label="Anterior"></button>
      <div id="progress" class="progress"></div>
      <span id="count" class="count"></span>
      <button id="btn-next" class="nav-btn primary" title="Siguiente (→)" aria-label="Siguiente"></button>
    </nav>

    <div id="index" class="index" hidden>
      <div class="index-box" role="dialog" aria-label="Índice">
        <div class="index-head"><h2>Recorrido</h2><p>Teclado: ← → avanzar · P panorámica · I índice · F pantalla completa · A animaciones</p><button id="index-close" class="tool" aria-label="Cerrar"></button></div>
        <div id="index-list" class="index-list"></div>
      </div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/world.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
